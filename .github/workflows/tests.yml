name: MCP tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Optional live test: RG date (YYYY-MM-DD)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q .
      - run: python -m unittest discover -v
      - run: python test_mock.py
  live:
    name: live (${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix:
        source: [core, resmi, lexpera, semantik]
    needs: offline
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.issue_date != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - env:
          RG_DATE: ${{ inputs.issue_date }}
          TEST_SOURCE: ${{ matrix.source }}
        run: python test_live.py "${RG_DATE:-$(TZ=Europe/Istanbul date +%F)}" "$TEST_SOURCE"
      - name: Başarısız kaynak için ağ aşamalarını ölç
        if: failure() && (matrix.source == 'resmi' || matrix.source == 'lexpera')
        env:
          RG_DATE: ${{ inputs.issue_date }}
          TEST_SOURCE: ${{ matrix.source }}
        run: |
          day="${RG_DATE:-$(TZ=Europe/Istanbul date +%F)}"
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          if [ "$TEST_SOURCE" = lexpera ]; then
            curl -sS --connect-timeout 8 --max-time 20 -o /dev/null \
              -w 'LEXPERA HTTP=%{http_code} DNS=%{time_namelookup} TCP=%{time_connect} TLS=%{time_appconnect} FIRST_BYTE=%{time_starttransfer}\n' \
              https://www.lexpera.com.tr/resmi-gazete || true
            exit 0
          fi
          for path in "fihrist?tarih=$day" "eskiler/${day:0:4}/${day:5:2}/${day//-/}.htm"; do
            curl -sS --connect-timeout 8 --max-time 20 -o /dev/null \
              -w "$path HTTP=%{http_code} DNS=%{time_namelookup} TCP=%{time_connect} TLS=%{time_appconnect} FIRST_BYTE=%{time_starttransfer}\n" \
              "https://www.resmigazete.gov.tr/$path" || true
          done

  quality:
    name: Sabit semantik kabul ve bağımsız ölçüm
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Sabit model dosyalarını kalite deneyi öncesinde hazırla
        run: python -c 'import semantik; semantik._model()'
      - run: python scripts/quality_compare.py --stage all
      - run: python scripts/candidate_eval.py
      - run: python scripts/semantic_eval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-quality-evidence
          path: evaluation/*.json

  semantic-regression:
    name: Temel sürüme göre semantik regresyon
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -c 'import semantik; semantik._model()'
      - run: python scripts/quality_regression.py

  container:
    name: Gerçek Docker imajı ve üretim öncesi deneme
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: İmajı commit damgasıyla derle
        run: |
          revision="$(git rev-parse HEAD)"
          echo "IMAGE_REVISION=$revision" >> "$GITHUB_ENV"
          docker build --build-arg "RELEASE_REVISION=$revision" -t yargitay-preflight .
      - name: Beklenen kaynak manifestini hazırla
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-expected"
          python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          names=[p.name for p in Path('.').glob('*.py') if not p.name.startswith('test_')]+['requirements.txt']
          manifest={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(names)}
          (Path(os.environ['RUNNER_TEMP'])/'mcp-expected/files.json').write_text(json.dumps(manifest))
          PYCODE
      - name: Ağsız imaj SHA, kaynak ve MCP testi
        run: |
          docker run --rm --network none -e "EXPECTED_SHA=$IMAGE_REVISION" \
            -v "$RUNNER_TEMP/mcp-expected:/expected:ro" -v "$PWD/scripts:/checks:ro" \
            yargitay-preflight python /checks/container_smoke.py
      - name: Üç resmî kaydı ve sabit modeli ayrı edin
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-preflight/cache"
          docker run --rm -i -e SEMANTIK_MODEL_CACHE=/cache \
            -v "$RUNNER_TEMP/mcp-preflight:/records" -v "$RUNNER_TEMP/mcp-preflight/cache:/cache" \
            yargitay-preflight python - <<'PYCODE'
          import asyncio,json
          from pathlib import Path
          import bedesten,semantik
          async def acquire():
              rows=[]
              for identifier in ('1163161600','498482500','1018167800'):
                  text=await bedesten.document(identifier)
                  rows.append({'id':'bedesten:'+identifier,'metin':text,
                               'kaynak':bedesten.SITE+'/ictihat/'+identifier})
              Path('/records/source.json').write_text(json.dumps(rows,ensure_ascii=False))
              print('Resmî kayıt edinimi:',[(r['id'],len(r['metin'])) for r in rows])
          asyncio.run(acquire())
          semantik._model()
          PYCODE
      - name: İmaj içinde ağsız CGK, ceza dairesi ve uzun karar denemesi
        run: |
          docker run --rm --network none -e SEMANTIK_MODEL_CACHE=/cache \
            -v "$RUNNER_TEMP/mcp-preflight:/records:ro" -v "$RUNNER_TEMP/mcp-preflight/cache:/cache:ro" \
            -v "$PWD/scripts:/app/scripts:ro" \
            yargitay-preflight python /app/scripts/preflight_semantic.py --source /records/source.json
