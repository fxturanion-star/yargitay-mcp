name: MCP tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Optional live test: RG date (YYYY-MM-DD)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q .
      - run: python -m unittest discover -v
      - run: python test_mock.py
  live:
    name: live (${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix:
        source: [core, resmi, lexpera, semantik]
    needs: offline
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.issue_date != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - env:
          RG_DATE: ${{ inputs.issue_date }}
          TEST_SOURCE: ${{ matrix.source }}
        run: python test_live.py "${RG_DATE:-$(TZ=Europe/Istanbul date +%F)}" "$TEST_SOURCE"
      - name: Bağımsız semantik sıralama değerlendirmesi
        if: ${{ !cancelled() && matrix.source == 'semantik' }}
        run: python scripts/semantic_eval.py
      - name: Resmî Gazete ağ aşamalarını ölç
        if: failure() && matrix.source == 'resmi'
        env:
          RG_DATE: ${{ inputs.issue_date }}
        run: |
          day="${RG_DATE:-$(TZ=Europe/Istanbul date +%F)}"
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          for path in "fihrist?tarih=$day" "eskiler/${day:0:4}/${day:5:2}/${day//-/}.htm"; do
            curl -sS --connect-timeout 8 --max-time 20 -o /dev/null \
              -w "$path HTTP=%{http_code} DNS=%{time_namelookup} TCP=%{time_connect} TLS=%{time_appconnect} FIRST_BYTE=%{time_starttransfer}\n" \
              "https://www.resmigazete.gov.tr/$path" || true
          done
