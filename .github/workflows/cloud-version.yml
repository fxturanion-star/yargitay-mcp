name: FastMCP Cloud sürüm doğrulaması
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fastmcp-production-version
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_cloud.py
        env:
          FASTMCP_VERIFY_TOKEN: ${{ secrets.FASTMCP_VERIFY_TOKEN }}
